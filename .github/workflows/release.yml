name: Release

# Tag push (v1.2.3) -> build -> GitHub Release page with assets.
# Manual: Actions -> Release -> Run workflow -> enter existing tag
# (publishes/re-publishes that tag's Release assets).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GTK4 + Libadwaita deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config \
            build-essential dpkg-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gtk/target
          key: ${{ matrix.arch }}-cargo-${{ hashFiles('gtk/Cargo.lock') }}

      - name: Test + build (release)
        run: |
          cargo test --release --manifest-path gtk/Cargo.toml
          cargo build --release --manifest-path gtk/Cargo.toml

      - name: Package .tar.gz + .deb + checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          VER="${TAG#v}"
          BIN=gtk/target/release/package-hub-gtk
          test -x "$BIN"
          mkdir -p dist staging/usr/bin staging/usr/share/applications \
            staging/usr/share/icons/hicolor/256x256/apps staging/DEBIAN

          # tarball
          cp "$BIN" dist/package-hub-gtk
          cp gtk/package-hub-gtk.desktop dist/
          cp LICENSE gtk/README.md dist/
          tar -C dist -czf "package-hub-gtk-${TAG}-linux-${ARCH}.tar.gz" \
            package-hub-gtk package-hub-gtk.desktop LICENSE README.md
          rm -rf dist

          # .deb (no extra tooling, dpkg-deb only)
          cp "$BIN" staging/usr/bin/package-hub-gtk
          cp gtk/package-hub-gtk.desktop staging/usr/share/applications/
          cp src-tauri/icons/128x128@2x.png \
            staging/usr/share/icons/hicolor/256x256/apps/package-hub.png
          cat > staging/DEBIAN/control <<EOF
          Package: package-hub-gtk
          Version: ${VER}
          Architecture: ${ARCH}
          Maintainer: gj <gj@alphingj.com>
          Depends: libgtk-4-1 (>= 4.8), libadwaita-1-0 (>= 1.3), libglib2.0-0t64 | libglib2.0-0
          Description: Graphical app store for Linux (GTK4 + Libadwaita)
           Install, remove, and update software across apt, dnf, pacman,
           zypper, and Flatpak - without touching a terminal.
          EOF
          sed -i 's/^          //' staging/DEBIAN/control
          dpkg-deb --root-owner-group --build staging "package-hub-gtk_${VER}_${ARCH}.deb"

          sha256sum "package-hub-gtk-${TAG}-linux-${ARCH}.tar.gz" \
            "package-hub-gtk_${VER}_${ARCH}.deb" > "SHA256SUMS-${ARCH}.txt"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: package-hub ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            package-hub-gtk-*.tar.gz
            package-hub-gtk_*.deb
            SHA256SUMS-*.txt

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-hub-gtk-${{ matrix.arch }}
          path: |
            package-hub-gtk-*.tar.gz
            package-hub-gtk_*.deb
            SHA256SUMS-*.txt
