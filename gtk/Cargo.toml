[package]
name = "package-hub-gtk"
version = "0.1.0"
description = "A graphical app store for Linux - GTK4 + Libadwaita native frontend"
authors = ["gj <gj@alphingj.com>"]
license = "MIT"
repository = "https://github.com/alphingj/package-hub"
edition = "2021"
rust-version = "1.85"

# Low feature floors = widest distro support. GTK >= 4.8 / Adwaita >= 1.3
# covers Debian 12, Ubuntu 23.10+/24.04, Fedora 39+, Arch, openSUSE, etc.
# Older distros: run the Flatpak build (org.gnome.Platform runtime ships
# current GTK/Adwaita regardless of host).
[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2"
